# Rivu CI（Forgejo Actions）。
# `runs-on` 的标签取决于 runner 的配置；这里假设有带 Docker 的 `docker` 标签 runner，按实际环境调整。
# 本文件尚未在真实的 Forgejo runner 上运行过。
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RIVU_GIT_COMMIT: ${{ github.sha }}

jobs:
  lint-and-unit:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Rust 工具链（版本由 rust-toolchain.toml 决定）
        run: rustup show
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（集成测试在没有 RIVU_TEST_* 变量时自动跳过）
        run: cargo test --workspace

  # 可选的短时模糊测试（cargo-fuzz / libFuzzer，目标与说明见 docs/research/fuzzing.md）。不阻塞合并：
  # `continue-on-error: true`。它要求 runner 满足三个条件，缺任何一个这个 job 会失败（但不影响其余 job）：
  #   1. 能装 nightly 工具链（cargo-fuzz 用 `-Zsanitizer`、`-Cpasses` 等 nightly 才有的编译选项；
  #      stable 的 rust-toolchain.toml 只管仓库里其余部分，这里显式用 `+nightly`）；
  #   2. 有 C++ 编译器（libfuzzer-sys 编译自带的 libFuzzer；`build-essential` 或 `clang` 都行）；
  #   3. 能访问 crates.io（`cargo install cargo-fuzz`）。
  # 每个目标只跑 FUZZ_SECONDS 秒：它抓的是「刚引入的、几秒内就能撞出来的」崩溃，长跑（每目标 10 分钟以上）
  # 在开发机上手工做，命令见 fuzz/run.sh。尚未在真实的 Forgejo runner 上运行过。
  fuzz-smoke:
    runs-on: docker
    needs: lint-and-unit
    continue-on-error: true
    env:
      FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - name: nightly 工具链
        run: rustup toolchain install nightly --profile minimal
      - name: 安装 cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: 构建全部模糊目标
        run: cargo +nightly fuzz build
      - name: 每个目标跑 ${{ env.FUZZ_SECONDS }} 秒（种子语料 fuzz/corpus，新语料写到临时目录）
        shell: bash
        run: |
          work="${RUNNER_TEMP:-/tmp}/rivu-fuzz-corpus"
          for t in parse_event query_spec hostname shield_diff source_classify; do
            echo "::group::$t"
            mkdir -p "$work/$t"
            dict=()
            [ -f "fuzz/dicts/$t.dict" ] && dict=("-dict=fuzz/dicts/$t.dict")
            cargo +nightly fuzz run "$t" "$work/$t" "fuzz/corpus/$t" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=16384 "${dict[@]}"
            echo "::endgroup::"
          done
      - name: 保存崩溃输入
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  migrate-and-integration:
    runs-on: docker
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: rivu_migrator
          POSTGRES_PASSWORD: rivu_ci
          POSTGRES_DB: rivu
        options: >-
          --health-cmd "pg_isready -U rivu_migrator -d rivu"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        env:
          # CI 里没法挂载 users.d，用一个有全部权限的账号代替四个角色。
          # 所以 CI 不验证账号权限分离，那部分只在本地 compose.dev 上验证。
          CLICKHOUSE_USER: rivu_ci
          CLICKHOUSE_PASSWORD: rivu_ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIVU_DATABASE_URL: postgres://rivu_migrator:rivu_ci@postgres:5432/rivu
      RIVU_CLICKHOUSE_URL: http://clickhouse:8123
      RIVU_CH_MIGRATOR_USER: rivu_ci
      RIVU_CH_MIGRATOR_PASSWORD: rivu_ci
      # 集成测试
      RIVU_TEST_DATABASE_URL: postgres://rivu_migrator:rivu_ci@postgres:5432/rivu
      RIVU_TEST_CLICKHOUSE_URL: http://clickhouse:8123
      RIVU_TEST_CH_MIGRATOR_USER: rivu_ci
      RIVU_TEST_CH_MIGRATOR_PASSWORD: rivu_ci
      RIVU_TEST_CH_WRITER_USER: rivu_ci
      RIVU_TEST_CH_WRITER_PASSWORD: rivu_ci
      RIVU_TEST_CH_READER_USER: rivu_ci
      RIVU_TEST_CH_READER_PASSWORD: rivu_ci
      RIVU_TEST_CH_MAINTAINER_USER: rivu_ci
      RIVU_TEST_CH_MAINTAINER_PASSWORD: rivu_ci
    steps:
      - uses: actions/checkout@v4
      - name: Rust 工具链
        run: rustup show
      - name: 构建 rivu
        run: cargo build -p rivu
      - name: rivu migrate（第一次：全部应用）
        run: ./target/debug/rivu migrate
      - name: rivu migrate（第二次：必须幂等，没有待执行的迁移）
        run: |
          out="$(./target/debug/rivu migrate)"
          echo "$out"
          echo "$out" | grep -q "没有待执行的迁移"
      - name: rivu migrate status
        run: ./target/debug/rivu migrate status
      - name: 集成测试
        run: cargo test -p rivu --test clickhouse_sessions -- --nocapture
      - name: 端到端测试（管线 -> ClickHouse -> 查询，与参考实现对比）
        run: cargo test -p rivu --test e2e_lite -- --nocapture

  # 浏览器采集脚本（apps/tracker）。与 Rust 的 job 互不依赖，可并行。
  tracker:
    runs-on: docker
    defaults:
      run:
        working-directory: apps/tracker
    env:
      # 构建号：单调递增，随事件以 sv 上报（规范 §8）。
      RIVU_SV: ${{ github.run_number }}
      # 体积回归 > 64 B 需要 label 批准时，由流水线按 label 设为 1（规范 §3.3）；默认不批准。
      RIVU_SIZE_APPROVED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装 pnpm（版本与 package.json 的 packageManager 一致）
        run: npm install -g pnpm@12.5.1
      - name: 安装依赖（锁文件必须是最新的）
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run typecheck
      - name: 构建
        run: pnpm run build
      - name: 产物检查（体积预算 gzip -9 ≤ 1024 B、模块泄漏、禁用 API、es2018、确定性）
        run: pnpm run size
      - name: 单元测试（node:test）
        run: node --test "test/unit/*.test.ts"
      # 浏览器测试需要 Playwright 的三个内核及其系统依赖。`--with-deps` 要 root 权限（apt-get）；
      # 如果 runner 镜像不是 root、或没有 apt，这一步会失败：此时应改用预装了浏览器的镜像
      # （如 mcr.microsoft.com/playwright）或自行安装依赖。镜像里缺任何一个内核的系统库，
      # 对应项目会在启动时报错，而不是被静默跳过。
      - name: 安装 Playwright 浏览器（chromium firefox webkit）
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: 浏览器测试（chromium / firefox / webkit）
        run: pnpm exec playwright test
      - name: 保存 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: tracker-playwright-report
          path: apps/tracker/playwright-report

  # 真实浏览器 -> 真实运行的 rivu -> ClickHouse -> rivu stats（apps/tracker/scripts/e2e-rivu.sh）。
  # 依赖 Rust 构建与 tracker 构建（脚本自己重新构建两者，所以这里只声明 needs，保证前两个 job 先通过）。
  # 尚未在真实的 Forgejo runner 上运行过：Playwright 的 --with-deps 要 root/apt；CI 里 ClickHouse 只有一个全权限账号
  # （见上面的 migrate-and-integration），所以四个角色账号变量都指向它。
  e2e-rivu:
    runs-on: docker
    needs: [migrate-and-integration, tracker]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: rivu_migrator
          POSTGRES_PASSWORD: rivu_ci
          POSTGRES_DB: rivu
        options: >-
          --health-cmd "pg_isready -U rivu_migrator -d rivu"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        env:
          CLICKHOUSE_USER: rivu_ci
          CLICKHOUSE_PASSWORD: rivu_ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIVU_SV: ${{ github.run_number }}
      RIVU_DATABASE_URL: postgres://rivu_migrator:rivu_ci@postgres:5432/rivu
      RIVU_CLICKHOUSE_URL: http://clickhouse:8123
      RIVU_CH_MIGRATOR_USER: rivu_ci
      RIVU_CH_MIGRATOR_PASSWORD: rivu_ci
      RIVU_CH_WRITER_USER: rivu_ci
      RIVU_CH_WRITER_PASSWORD: rivu_ci
      RIVU_CH_READER_USER: rivu_ci
      RIVU_CH_READER_PASSWORD: rivu_ci
      RIVU_CH_MAINTAINER_USER: rivu_ci
      RIVU_CH_MAINTAINER_PASSWORD: rivu_ci
    steps:
      - uses: actions/checkout@v4
      - name: Rust 工具链
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装 pnpm
        run: npm install -g pnpm@12.5.1
      - name: 浏览器与系统依赖（需要 root / apt）
        run: |
          cd apps/tracker
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: 真实浏览器端到端
        run: RIVU_E2E_SKIP_INSTALL=1 bash apps/tracker/scripts/e2e-rivu.sh
