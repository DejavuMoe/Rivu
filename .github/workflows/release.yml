name: release

# Stable releases are tagged vX.Y.Z and also move the `latest` image tag.
# Release candidates are tagged vX.Y.Z-rc.N: same checks, the image is pushed as X.Y.Z-rc.N only.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.repository == 'DejavuMoe/Rivu' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      base: ${{ steps.release.outputs.base }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Check out the event SHA and keep the separately fetched tag ref for verification.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, Cargo version and master CI
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          part='(0|[1-9][0-9]*)'
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v${part}\.${part}\.${part}(-rc\.${part})?$ ]]; then
            echo "::error::The release tag must be vX.Y.Z or a release candidate vX.Y.Z-rc.N"
            exit 1
          fi
          version="${GITHUB_REF#refs/tags/v}"
          # A release candidate is built from the same Cargo version as the release it precedes.
          base="${version%%-*}"
          prerelease=false
          if [[ "$version" != "$base" ]]; then
            prerelease=true
          fi
          commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
          if [[ "$commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The tag's commit does not match the pushed commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/master; then
            echo "::error::$commit must be reachable from origin/master"
            exit 1
          fi

          manifest="$(realpath bin/rivu/Cargo.toml)"
          cargo_version="$(cargo metadata --manifest-path "$manifest" --format-version 1 --no-deps --locked \
            | jq -er --arg manifest "$manifest" \
                '.packages[] | select(.name == "rivu" and .manifest_path == $manifest) | .version')"
          if [[ "$base" != "$cargo_version" ]]; then
            echo "::error::Tag version $base does not match the Cargo rivu version $cargo_version"
            exit 1
          fi

          if ! gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=master -f event=push -f status=success -f head_sha="$commit" -f per_page=1 \
            | jq -e --arg commit "$commit" 'any(.workflow_runs[];
                .head_sha == $commit and .head_branch == "master" and .event == "push"
                and .status == "completed" and .conclusion == "success")' >/dev/null; then
            echo "::error::Cannot confirm that the master push CI (ci.yml) succeeded for $commit"
            exit 1
          fi
          printf 'version=%s\nbase=%s\nprerelease=%s\ncommit=%s\n' \
            "$version" "$base" "$prerelease" "$commit" >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dejavumoe/rivu
      VERSION: ${{ needs.verify.outputs.version }}
      BASE: ${{ needs.verify.outputs.base }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Build the image and verify its version
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "RIVU_VERSION=$VERSION" \
            --build-arg "RIVU_GIT_COMMIT=$COMMIT" \
            --build-arg "RIVU_SV=$GITHUB_RUN_NUMBER" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            -t "$IMAGE:$VERSION" .
          actual="$(docker run --rm "$IMAGE:$VERSION" --version)"
          # The binary reports the Cargo version, so a release candidate prints the base version.
          if [[ "$actual" != "rivu $BASE (commit $COMMIT)" ]]; then
            echo "::error::The image version output does not match the release version or commit"
            printf '%s\n' "$actual"
            exit 1
          fi
      - name: Push the version tag, and latest for a stable release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Release candidate: latest is left unchanged"
          else
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
