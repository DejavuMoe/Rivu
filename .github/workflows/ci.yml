name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RIVU_GIT_COMMIT: ${{ github.sha }}

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 工具链（版本由 rust-toolchain.toml 决定）
        run: rustup show
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（集成测试在没有 RIVU_TEST_* 变量时自动跳过）
        run: cargo test --workspace

  # 短时模糊测试。保留崩溃输入，作业失败不阻塞合并。
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-unit
    continue-on-error: true
    env:
      FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly 工具链
        run: rustup toolchain install nightly --profile minimal
      - name: 安装 cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: 构建全部模糊目标
        run: cargo +nightly fuzz build
      - name: 每个目标跑 ${{ env.FUZZ_SECONDS }} 秒（种子语料 fuzz/corpus，新语料写到临时目录）
        run: |
          work="${RUNNER_TEMP}/rivu-fuzz-corpus"
          for t in parse_event query_spec hostname shield_diff source_classify; do
            echo "::group::$t"
            mkdir -p "$work/$t"
            dict=()
            [ -f "fuzz/dicts/$t.dict" ] && dict=("-dict=fuzz/dicts/$t.dict")
            cargo +nightly fuzz run "$t" "$work/$t" "fuzz/corpus/$t" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=16384 "${dict[@]}"
            echo "::endgroup::"
          done
      - name: 保存崩溃输入
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  migrate-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:18.6-alpine
        ports:
          - 127.0.0.1:15432:5432
        env:
          POSTGRES_USER: rivu_migrator
          POSTGRES_PASSWORD: rivu_ci
          POSTGRES_DB: rivu
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rivu_migrator -d rivu"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        ports:
          - 127.0.0.1:18123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIVU_DATABASE_URL: postgres://rivu_migrator:rivu_ci@127.0.0.1:15432/rivu
      RIVU_CLICKHOUSE_URL: http://127.0.0.1:18123
      RIVU_CH_MIGRATOR_USER: rivu_migrator
      RIVU_CH_MIGRATOR_PASSWORD: rivu_dev_migrator
      # 集成测试
      RIVU_TEST_DATABASE_URL: postgres://rivu_migrator:rivu_ci@127.0.0.1:15432/rivu
      RIVU_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
      RIVU_TEST_CH_MIGRATOR_USER: rivu_migrator
      RIVU_TEST_CH_MIGRATOR_PASSWORD: rivu_dev_migrator
      RIVU_TEST_CH_WRITER_USER: rivu_writer
      RIVU_TEST_CH_WRITER_PASSWORD: rivu_dev_writer
      RIVU_TEST_CH_READER_USER: rivu_reader
      RIVU_TEST_CH_READER_PASSWORD: rivu_dev_reader
      RIVU_TEST_CH_MAINTAINER_USER: rivu_maintainer
      RIVU_TEST_CH_MAINTAINER_PASSWORD: rivu_dev_maintainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # schema_snapshot 包含物化视图的 definer，query_security 检查 reader profile。
      - name: 加载开发用 ClickHouse 账号与权限
        env:
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          docker cp deploy/clickhouse/users.d/rivu-dev.xml "$CLICKHOUSE_CONTAINER:/etc/clickhouse-server/users.d/rivu-dev.xml"
          docker exec "$CLICKHOUSE_CONTAINER" clickhouse-client --query 'SYSTEM RELOAD CONFIG'
      - name: Rust 工具链
        run: rustup show
      - name: 构建 rivu
        run: cargo build -p rivu
      - name: rivu migrate（第一次：全部应用）
        run: ./target/debug/rivu migrate
      - name: rivu migrate（第二次：必须幂等，没有待执行的迁移）
        run: |
          out="$(./target/debug/rivu migrate)"
          echo "$out"
          grep -Fx "没有待执行的迁移" <<<"$out"
      - name: rivu migrate status
        run: ./target/debug/rivu migrate status
      - name: 全量 rivu 测试（含真实 DB schema_snapshot）
        run: cargo test -p rivu --tests --no-fail-fast -- --nocapture

  # 浏览器采集脚本（apps/tracker）。与 Rust 的 job 互不依赖，可并行。
  tracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/tracker
    env:
      # 构建号：单调递增，随事件以 sv 上报（规范 §8）。
      RIVU_SV: ${{ github.run_number }}
      # 体积回归 > 64 B 需要 label 批准时，由流水线按 label 设为 1（规范 §3.3）；默认不批准。
      RIVU_SIZE_APPROVED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: 安装 pnpm（版本与 package.json 的 packageManager 一致）
        run: npm install -g pnpm@12.5.1
      - name: 安装依赖（锁文件必须是最新的）
        id: install
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm run build
      - name: 产物检查（体积预算 gzip -9 ≤ 1024 B、模块泄漏、禁用 API、es2018、确定性）
        run: pnpm run size
      - name: 单元测试（node:test）
        run: node --test "test/unit/*.test.ts"
      - name: 安装 Playwright 浏览器（chromium firefox webkit）
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: 浏览器测试（chromium / firefox / webkit）
        run: pnpm exec playwright test
      - name: 类型检查
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck
      - name: 保存 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracker-playwright-report
          path: |
            apps/tracker/playwright-report
            apps/tracker/test-results

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: 安装 pnpm
        run: npm install -g pnpm@12.5.1
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run check
      - name: 单元测试
        run: pnpm test

  # 真实浏览器 -> rivu -> ClickHouse -> rivu query。
  e2e-rivu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:18.6-alpine
        ports:
          - 127.0.0.1:15432:5432
        env:
          POSTGRES_USER: rivu_migrator
          POSTGRES_PASSWORD: rivu_ci
          POSTGRES_DB: rivu
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rivu_migrator -d rivu"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        ports:
          - 127.0.0.1:18123:8123
        env:
          CLICKHOUSE_USER: rivu_ci
          CLICKHOUSE_PASSWORD: rivu_ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIVU_SV: ${{ github.run_number }}
      RIVU_DATABASE_URL: postgres://rivu_migrator:rivu_ci@127.0.0.1:15432/rivu
      RIVU_CLICKHOUSE_URL: http://127.0.0.1:18123
      RIVU_CH_MIGRATOR_USER: rivu_ci
      RIVU_CH_MIGRATOR_PASSWORD: rivu_ci
      RIVU_CH_WRITER_USER: rivu_ci
      RIVU_CH_WRITER_PASSWORD: rivu_ci
      RIVU_CH_READER_USER: rivu_ci
      RIVU_CH_READER_PASSWORD: rivu_ci
      RIVU_CH_MAINTAINER_USER: rivu_ci
      RIVU_CH_MAINTAINER_PASSWORD: rivu_ci
      RIVU_VISITOR_PEPPER: rivu-ci-visitor-pepper-not-for-production-use
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 工具链
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: 安装 pnpm
        run: npm install -g pnpm@12.5.1
      - name: 安装 Playwright 浏览器和系统依赖
        run: |
          cd apps/tracker
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: 真实浏览器端到端
        run: RIVU_E2E_SKIP_INSTALL=1 bash apps/tracker/scripts/e2e-rivu.sh
      - name: 保存实服务 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracker-e2e-rivu-report
          path: |
            apps/tracker/playwright-report-rivu
            apps/tracker/test-results

  # 依赖的已知漏洞（RustSec 公告库）。有公告就失败；确认不受影响的公告在 audit.toml 里忽略并写明理由。
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_IMAGE: rivu:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 构建候选镜像并检查版本
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg RIVU_VERSION=0.0.0-ci \
            --build-arg RIVU_GIT_COMMIT="$RIVU_GIT_COMMIT" \
            -t "$CANDIDATE_IMAGE" .
          docker run --rm "$CANDIDATE_IMAGE" --version
      - name: 生产 Compose 空卷冒烟
        run: bash .github/scripts/compose-smoke.sh "$CANDIDATE_IMAGE" "$RUNNER_TEMP/rivu-compose-smoke.log"
      - name: 保存 Compose 失败日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke-logs
          path: ${{ runner.temp }}/rivu-compose-smoke.log
          if-no-files-found: ignore
