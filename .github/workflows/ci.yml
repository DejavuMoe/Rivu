name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RIVU_GIT_COMMIT: ${{ github.sha }}

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test (integration tests skip themselves without RIVU_TEST_* variables)
        run: cargo test --locked --workspace

  # Short fuzz run. Crash inputs are kept, and a failing job does not block merging.
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-unit
    continue-on-error: true
    env:
      FUZZ_SECONDS: "60"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build all fuzz targets
        run: cargo +nightly fuzz build
      - name: Fuzz each target for ${{ env.FUZZ_SECONDS }}s (seed corpus in fuzz/corpus, new inputs go to a temp dir)
        run: |
          work="${RUNNER_TEMP}/rivu-fuzz-corpus"
          for t in parse_event query_spec hostname shield_diff source_classify; do
            echo "::group::$t"
            mkdir -p "$work/$t"
            dict=()
            [ -f "fuzz/dicts/$t.dict" ] && dict=("-dict=fuzz/dicts/$t.dict")
            cargo +nightly fuzz run "$t" "$work/$t" "fuzz/corpus/$t" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=16384 "${dict[@]}"
            echo "::endgroup::"
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  migrate-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine
        ports:
          - 127.0.0.1:15432:5432
        env:
          POSTGRES_USER: rivu_migrator
          POSTGRES_PASSWORD: rivu_ci
          POSTGRES_DB: rivu
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rivu_migrator -d rivu"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        ports:
          - 127.0.0.1:18123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIVU_DATABASE_URL: postgres://rivu_migrator:rivu_ci@127.0.0.1:15432/rivu
      RIVU_CLICKHOUSE_URL: http://127.0.0.1:18123
      RIVU_CH_MIGRATOR_USER: rivu_migrator
      RIVU_CH_MIGRATOR_PASSWORD: rivu_dev_migrator
      # Integration tests
      RIVU_TEST_DATABASE_URL: postgres://rivu_migrator:rivu_ci@127.0.0.1:15432/rivu
      RIVU_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
      RIVU_TEST_CH_MIGRATOR_USER: rivu_migrator
      RIVU_TEST_CH_MIGRATOR_PASSWORD: rivu_dev_migrator
      RIVU_TEST_CH_WRITER_USER: rivu_writer
      RIVU_TEST_CH_WRITER_PASSWORD: rivu_dev_writer
      RIVU_TEST_CH_READER_USER: rivu_reader
      RIVU_TEST_CH_READER_PASSWORD: rivu_dev_reader
      RIVU_TEST_CH_MAINTAINER_USER: rivu_maintainer
      RIVU_TEST_CH_MAINTAINER_PASSWORD: rivu_dev_maintainer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # schema_snapshot covers materialized-view definers, and query_security checks the reader profile.
      - name: Load the development ClickHouse users and grants
        env:
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          docker cp deploy/clickhouse/users.d/rivu-dev.xml "$CLICKHOUSE_CONTAINER:/etc/clickhouse-server/users.d/rivu-dev.xml"
          docker exec "$CLICKHOUSE_CONTAINER" clickhouse-client --query 'SYSTEM RELOAD CONFIG'
      - name: Rust toolchain
        run: rustup show
      - name: Build rivu
        run: cargo build --locked -p rivu
      - name: rivu migrate (first run applies everything)
        run: ./target/debug/rivu migrate
      - name: rivu migrate (second run must be idempotent, nothing pending)
        run: |
          out="$(./target/debug/rivu migrate)"
          echo "$out"
          # The CLI prints this Chinese line when no migration is pending.
          grep -Fx "没有待执行的迁移" <<<"$out"
      - name: rivu migrate status
        run: ./target/debug/rivu migrate status
      - name: Full rivu tests (including schema_snapshot against real databases)
        run: cargo test --locked -p rivu --tests --no-fail-fast -- --nocapture

  # Browser tracker script (apps/tracker). Independent of the Rust jobs, so it runs in parallel.
  tracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/tracker
    env:
      # Build number: monotonically increasing, reported with events as sv (spec §8).
      RIVU_SV: ${{ github.run_number }}
      # A size regression over 64 B needs label approval; the pipeline sets this to 1 from the label (spec §3.3). Not approved by default.
      RIVU_SIZE_APPROVED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm (version matches packageManager in package.json)
        run: npm install -g pnpm@12.5.1
      - name: Install dependencies (lockfile must be up to date)
        id: install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Check build output (size budget gzip -9 ≤ 1024 B, module leaks, banned APIs, es2018, determinism)
        run: pnpm run size
      - name: Unit tests (node:test)
        run: node --test "test/unit/*.test.ts"
      - name: Install Playwright browsers (chromium, firefox, webkit)
        run: bash ../../.github/scripts/install-playwright.sh
      - name: Browser tests (chromium / firefox / webkit)
        run: pnpm exec playwright test
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracker-playwright-report
          path: |
            apps/tracker/playwright-report
            apps/tracker/test-results

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Mechanical part of apps/dashboard/DESIGN.md: tokens only, four font sizes, hairline borders,
      # and the prototype's tokens and shared components identical to production. Needs no dependencies.
      - name: Design rules (dashboard and prototype)
        working-directory: .
        run: node tools/design-lint/check.mjs
      - name: Install pnpm
        run: npm install -g pnpm@12.5.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run check
      - name: Unit tests
        run: pnpm test

  # UI prototype (designs/rivu-svelte): it is the reference for dashboard changes, so it has to keep building.
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: designs/rivu-svelte
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm@12.5.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run check
      - name: Build the single-file prototype
        run: pnpm run build

  # Real browser -> rivu -> ClickHouse -> rivu query.
  e2e-rivu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine
        ports:
          - 127.0.0.1:15432:5432
        env:
          POSTGRES_USER: rivu_migrator
          POSTGRES_PASSWORD: rivu_ci
          POSTGRES_DB: rivu
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rivu_migrator -d rivu"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        ports:
          - 127.0.0.1:18123:8123
        env:
          CLICKHOUSE_USER: rivu_ci
          CLICKHOUSE_PASSWORD: rivu_ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIVU_SV: ${{ github.run_number }}
      RIVU_DATABASE_URL: postgres://rivu_migrator:rivu_ci@127.0.0.1:15432/rivu
      RIVU_CLICKHOUSE_URL: http://127.0.0.1:18123
      RIVU_CH_MIGRATOR_USER: rivu_ci
      RIVU_CH_MIGRATOR_PASSWORD: rivu_ci
      RIVU_CH_WRITER_USER: rivu_ci
      RIVU_CH_WRITER_PASSWORD: rivu_ci
      RIVU_CH_READER_USER: rivu_ci
      RIVU_CH_READER_PASSWORD: rivu_ci
      RIVU_CH_MAINTAINER_USER: rivu_ci
      RIVU_CH_MAINTAINER_PASSWORD: rivu_ci
      RIVU_VISITOR_PEPPER: rivu-ci-visitor-pepper-not-for-production-use
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm@12.5.1
      - name: Install Playwright browsers and system dependencies
        run: |
          cd apps/tracker
          pnpm install --frozen-lockfile
          bash ../../.github/scripts/install-playwright.sh
      - name: Real-browser end-to-end tests
        run: RIVU_E2E_SKIP_INSTALL=1 bash apps/tracker/scripts/e2e-rivu.sh
      - name: Upload live-server Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracker-e2e-rivu-report
          path: |
            apps/tracker/playwright-report-rivu
            apps/tracker/test-results

  # Known vulnerabilities in dependencies (RustSec advisory database). Any advisory fails the job; advisories confirmed not to apply are ignored in audit.toml with the reason written down.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        id: audit-pnpm
        run: npm install -g pnpm@12.5.1
      - name: pnpm audit (tracker)
        working-directory: apps/tracker
        run: pnpm audit
      - name: pnpm audit (dashboard)
        if: ${{ !cancelled() && steps.audit-pnpm.outcome == 'success' }}
        working-directory: apps/dashboard
        run: pnpm audit

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_IMAGE: rivu:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the candidate image and check its version
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg RIVU_VERSION=0.0.0-ci \
            --build-arg RIVU_GIT_COMMIT="$RIVU_GIT_COMMIT" \
            -t "$CANDIDATE_IMAGE" .
          version="$(docker run --rm "$CANDIDATE_IMAGE" --version)"
          printf '%s\n' "$version"
          if [[ "$version" != *" (commit $RIVU_GIT_COMMIT)" ]]; then
            echo "::error::Image version does not identify commit $RIVU_GIT_COMMIT"
            exit 1
          fi
      - name: Production Compose smoke test (empty volumes)
        run: bash .github/scripts/compose-smoke.sh "$CANDIDATE_IMAGE" "$RUNNER_TEMP/rivu-compose-smoke.log"
      - name: Upload Compose failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke-logs
          path: ${{ runner.temp }}/rivu-compose-smoke.log
          if-no-files-found: ignore
