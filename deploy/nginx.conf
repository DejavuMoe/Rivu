# Rivu 的 nginx 反向代理配置示例（与 deploy/Caddyfile 等价）。放进 /etc/nginx/conf.d/ 后
# 改 server_name 与证书路径；rivu 按 deploy/compose.yml 只监听 127.0.0.1:8080。
#
# - 整个站点都交给 rivu：看板页面、/js/* 采集脚本、/api/* 采集与查询。
# - 必须传 X-Forwarded-For：rivu 用它判断访客的国家，并只信任 RIVU_TRUSTED_PROXIES 里的代理
#   （compose 部署时对端是 compose 网络的网关，已在信任范围内）。
# - 采集请求很小，不需要缓冲；proxy_next_upstream 让 rivu 重启的那几秒里请求重试一次。
# - 访问日志：rivu 的隐私承诺是不保存访客 IP，这里用不含 $remote_addr 的日志格式，或者关掉访问日志。
# - 页面的 CSP 由看板自己写在 index.html 里，这里不要再加 Content-Security-Policy。

log_format rivu_noip '[$time_local] "$request" $status $body_bytes_sent "$http_referer"';

# 退订 URL 携带凭据。
map $uri $rivu_log_request {
    default 1;
    ~^/api/weekly-report/unsubscribe/ 0;
}

upstream rivu {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.example.com;
    access_log /var/log/nginx/rivu.access.log rivu_noip if=$rivu_log_request;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.example.com;

    ssl_certificate     /etc/letsencrypt/live/stats.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.example.com/privkey.pem;

    access_log /var/log/nginx/rivu.access.log rivu_noip if=$rivu_log_request;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 采集请求体上限是 8 KB，查询 API 是 1 MB
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location ^~ /api/weekly-report/unsubscribe/ {
        # 上游故障的错误日志会包含完整的请求路径和凭据。
        error_log /dev/null;
        proxy_pass http://rivu;
    }

    location / {
        proxy_pass http://rivu;
    }
}
