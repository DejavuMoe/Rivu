[package]
name = "rivu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Rivu：开源、自托管的网站分析系统（单个二进制，按角色启动）"

[lints]
workspace = true

[lib]
name = "rivu"
path = "src/lib.rs"

[[bin]]
name = "rivu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
clickhouse.workspace = true
csv.workspace = true
http-body-util.workspace = true
jiff.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
moka.workspace = true
qrcode.workspace = true
rand.workspace = true
rivu-auth.workspace = true
rivu-common.workspace = true
rivu-domain.workspace = true
rivu-geo.workspace = true
rivu-ingest.workspace = true
rivu-jobs.workspace = true
rivu-mail.workspace = true
rivu-query.workspace = true
rivu-ratelimit.workspace = true
rivu-session.workspace = true
rivu-storage-ch.workspace = true
rivu-storage-pg.workspace = true
rivu-ua.workspace = true
rivu-writer.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
clickhouse = { workspace = true, features = ["time", "uuid"] }
reqwest.workspace = true
rivu-reference.workspace = true
rustls.workspace = true
serde_json.workspace = true
time.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
