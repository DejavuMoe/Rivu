[workspace]
resolver = "3"
# cargo-fuzz 的独立 crate（有自己的 lockfile 与 target），不参与工作区构建。
exclude = ["fuzz"]
members = [
    "bin/rivu",
    "crates/auth",
    "crates/common",
    "crates/domain",
    "crates/geo",
    "crates/ingest",
    "crates/jobs",
    "crates/mail",
    "crates/query",
    "crates/ratelimit",
    "crates/reference",
    "crates/session",
    "crates/source",
    "crates/storage-ch",
    "crates/storage-pg",
    "crates/ua",
    "crates/writer",
    "tools/loadgen",
    "tools/reconcile",
    "tools/reident",
    "tools/replay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# 工作区内部 crate
rivu-auth = { path = "crates/auth" }
rivu-common = { path = "crates/common" }
rivu-domain = { path = "crates/domain" }
rivu-geo = { path = "crates/geo" }
rivu-ingest = { path = "crates/ingest" }
rivu-jobs = { path = "crates/jobs" }
rivu-mail = { path = "crates/mail" }
rivu-query = { path = "crates/query" }
rivu-ratelimit = { path = "crates/ratelimit" }
rivu-reference = { path = "crates/reference" }
rivu-session = { path = "crates/session" }
rivu-source = { path = "crates/source" }
rivu-ua = { path = "crates/ua" }
rivu-writer = { path = "crates/writer" }
rivu-storage-pg = { path = "crates/storage-pg" }
rivu-storage-ch = { path = "crates/storage-ch" }

# 第三方依赖
anyhow = "1"
arc-swap = "1"
# 密码哈希（rivu-auth）：argon2id。0.5 系列；不开默认特性（rand_core 0.6 的 OsRng），盐用工作区的 rand 0.9 生成。
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# API key（rivu-auth）：32 字节随机数的 base64url 编码、哈希的常数时间比较。
base64 = { version = "0.22", default-features = false, features = ["std"] }
subtle = "2"
# 测试用：`ServiceExt::oneshot` 直接驱动 axum Router，不起监听端口。
tower = { version = "0.5", default-features = false, features = ["util"] }
# 公开查询 API 读请求体：区分「超过上限」与其他读取错误（`LengthLimitError`）；axum 本来就依赖它。
http-body-util = "0.1"
jiff = "0.2"
# GeoIP（rivu-geo）：mmdb 读取、下载（reqwest 关闭默认 TLS 后端，由我们注入 ring + webpki-roots，
# 与 clickhouse 的选择一致，避免引入 aws-lc）、gzip / tar.gz 解压。
maxminddb = "0.32"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
flate2 = "1"
# Plausible 导出的 zip 与其中的 CSV（rivu-jobs 的导入）
csv = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
# UA 解析（rivu-ua）：uap-core 官方 Rust 实现、纯 Rust YAML 解析、UA 结果缓存。
moka = { version = "0.12", default-features = false, features = ["sync"] }
serde-saphyr = "2"
ua-parser = "0.2"
parking_lot = "0.12"
percent-encoding = "2"
# 查询内核（rivu-query）：QuerySpec 的 JSON Schema 与字段路径错误、正则预校验；SQL 与 schema 快照测试。
schemars = "1"
serde_path_to_error = "0.1"
regex = "1"
insta = { version = "1", features = ["json"] }
proptest = "1"
rand = "0.9"
# 两步验证（rivu-auth）：HMAC-SHA1、HKDF、AES-256-GCM。与 rustls 用同一个 ring。
ring = "0.17"
# 两步验证设置页的二维码（服务端生成 SVG）。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 邮件（rivu-mail）：SMTP，TLS 用 rustls + ring + webpki-roots（与其余出站连接一致）。
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "rustls-tls"] }
siphasher = "1"
url = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "string"] }
clickhouse = { version = "0.15", default-features = false, features = ["lz4", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
include_dir = "0.7"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }
uuid = { version = "1", features = ["v7"] }

# argon2id 在 opt-level 0 下慢两个数量级（一次哈希要几秒）：登录与测试都要算哈希，所以依赖包始终优化。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
