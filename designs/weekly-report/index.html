<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>我的周报 – Rivu</title>
  <style>
    :root {
      color-scheme: light;
      --bg-app: #fcfcfc; --bg-subtle: #f9f9f9; --bg-element: #f0f0f0; --bg-hover: #e8e8e8;
      --border-subtle: #d9d9d9; --border: #cecece; --border-hover: #bbb;
      --text-muted: #646464; --text: #202020; --accent-solid: #0090ff; --accent-solid-hover: #0588f0; --accent-contrast: #ffffff; --accent-focus: #5eb1ef;
      --good-bg: #e9f6e9; --good-text: #2a7e3b; --warn-bg: #fff7c2; --warn-text: #ab6400; --bad-text: #ce2c31;
      --font-sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      --hairline: 0.5px; --r-sm: 6px; --r-md: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg-app: #111; --bg-subtle: #191919; --bg-element: #222; --bg-hover: #2a2a2a;
        --border-subtle: #3a3a3a; --border: #484848; --border-hover: #606060;
        --text-muted: #b4b4b4; --text: #eee; --accent-focus: #2870bd;
        --accent-solid-hover: #3b9eff;
        --good-bg: #1b2a1e; --good-text: #71d083; --warn-bg: #302008; --warn-text: #ffca16; --bad-text: #ff9592;
      }
    }
    * { box-sizing: border-box; }
    html { display: grid; min-height: 100%; }
    body { display: flex; flex-direction: column; margin: 0; background: var(--bg-app); color: var(--text); font: 14px/1.5 var(--font-sans); }
    h1, h2, p, dl, dd { margin: 0; }
    h1 { font-size: 16px; font-weight: 600; }
    h2 { font-size: 14px; font-weight: 600; }
    [hidden] { display: none !important; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent-focus); outline-offset: 2px; }
    button, input, select { font: inherit; color: inherit; }
    button, input, select {
      min-height: 32px; border: var(--hairline) solid var(--border); border-radius: var(--r-sm); background: var(--bg-app);
    }
    button { padding: 0 12px; font-weight: 500; cursor: pointer; }
    button:hover, select:hover, input:hover { border-color: var(--border-hover); }
    button:hover { background: var(--bg-element); }
    button.primary { background: var(--accent-solid); border-color: transparent; color: var(--accent-contrast); }
    button.primary:hover:not(:disabled) { background: var(--accent-solid-hover); }
    button.ghost { border-color: transparent; color: var(--text-muted); }
    button:disabled, button[aria-disabled="true"] { opacity: .55; cursor: default; }
    button[aria-busy="true"] { cursor: progress; }
    input { width: 100%; max-width: 320px; min-width: 0; padding: 4px 10px; }
    input[aria-invalid="true"] { border-color: var(--bad-text); }
    select { max-width: 100%; padding: 4px 6px; }
    .preview {
      padding: 8px 16px; background: var(--bg-element); border-bottom: var(--hairline) solid var(--border);
    }
    .preview summary { width: fit-content; cursor: pointer; font-size: 12px; font-weight: 600; }
    .preview-content, .preview-fields, .preview-inbox, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .preview-content { margin-top: 8px; gap: 12px 20px; }
    .preview-fields, .preview-inbox { font-size: 12px; }
    .preview-fields label { display: inline-flex; align-items: center; gap: 6px; }
    .preview-inbox code { order: 1; overflow-wrap: anywhere; user-select: all; }
    .app { flex: 1; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .sidebar {
      display: flex; flex-direction: column; gap: 4px; padding: 16px 12px;
      background: var(--bg-subtle); border-right: var(--hairline) solid var(--border-subtle);
    }
    .wordmark { padding: 4px 8px 16px; font-size: 16px; font-weight: 600; }
    .side-item { padding: 9px 8px; border-radius: var(--r-sm); color: var(--text-muted); }
    .side-item.current { background: var(--bg-hover); color: var(--text); font-weight: 500; }
    .mobile-header { display: none; }
    .page { width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 32px 48px; }
    .site-header { margin-bottom: 24px; }
    .site-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .avatar { width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r-sm); background: var(--bg-element); font-size: 12px; }
    .tabs { display: flex; gap: 4px; border-bottom: var(--hairline) solid var(--border-subtle); }
    .tabs > * { display: flex; align-items: center; padding: 0 8px; min-height: 36px; color: var(--text-muted); white-space: nowrap; }
    .tabs [aria-current] { box-shadow: inset 0 -2px var(--accent-solid); color: var(--text); font-weight: 500; }
    .layout { display: grid; grid-template-columns: 184px minmax(0, 720px); align-items: start; gap: 32px; }
    .sections { display: flex; flex-direction: column; gap: 2px; margin-left: -10px; }
    .sections > * { display: flex; align-items: center; min-height: 32px; padding: 0 10px; color: var(--text-muted); border-radius: var(--r-sm); }
    .sections [aria-current] { background: var(--bg-hover); color: var(--text); font-weight: 500; }
    .card { container-type: inline-size; min-width: 0; border: var(--hairline) solid var(--border-subtle); border-radius: var(--r-md); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 12px 20px 0; }
    .card-body { padding: 12px 20px 20px; }
    .badge { padding: 2px 6px; border-radius: 4px; background: var(--bg-element); color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .badge[data-state="pending"] { background: var(--warn-bg); color: var(--warn-text); }
    .badge[data-state="active"] { background: var(--good-bg); color: var(--good-text); }
    .field { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 1.5fr); gap: 24px; padding: 16px 0; }
    .field + .field, #verification { border-top: var(--hairline) solid var(--border-subtle); }
    .field:first-child { padding-top: 0; }
    .field:last-child { padding-bottom: 0; }
    .field dt, .field label { font-weight: 500; }
    .field dd { overflow-wrap: anywhere; }
    .hint, .error, #feedback { font-size: 12px; }
    .hint, #feedback { color: var(--text-muted); }
    .hint { margin-top: 2px; }
    .error, #problem { color: var(--bad-text); }
    .error:not(:empty) { margin-top: 4px; }
    .callout { margin-top: 16px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--warn-bg); color: var(--warn-text); }
    .card-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: var(--hairline) solid var(--border-subtle); }
    #feedback:not(:empty) { flex: 1 1 180px; }
    #feedback[data-tone="bad"] { color: var(--bad-text); }
    #cooldown { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    .denied .layout { display: block; max-width: 720px; }
    @container (max-width: 420px) {
      .field { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    }
    @media (max-width: 860px) {
      .app { display: block; }
      .sidebar, .site-title { display: none; }
      .mobile-header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: var(--hairline) solid var(--border-subtle); }
      .mobile-header strong { color: var(--text-muted); }
    }
    @media (max-width: 720px) {
      .page { padding: 8px 16px 40px; }
      .site-header { margin-bottom: 16px; }
      .tabs { overflow: auto; margin-inline: -16px; padding-inline: 8px; }
      .tabs > * { min-height: 40px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .sections { flex-direction: row; gap: 4px; margin: 0; overflow: auto; border-bottom: var(--hairline) solid var(--border-subtle); }
      .sections > * { flex: none; min-height: 40px; }
      .sections [aria-current] { border-radius: 0; background: transparent; box-shadow: inset 0 -2px var(--accent-solid); }
      .field { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 12px 0; }
      .card-header, .card-body, .card-footer { padding-inline: 16px; }
      button, input, select { min-height: 36px; }
    }
    @media (max-width: 520px) {
      .preview-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
      .preview-fields label { flex-direction: column; align-items: stretch; gap: 2px; }
    }
  </style>
</head>
<body>
  <details class="preview" id="preview" data-screen-id="weekly-report-preview">
    <summary data-copy="preview"></summary>
    <div class="preview-content">
      <div class="preview-fields">
        <label><span data-copy="language"></span>
          <select id="language"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="en" lang="en">English</option></select>
        </label>
        <label><span data-copy="sites"></span>
          <select id="site"><option value="studio">studio.example.com</option><option value="docs">docs.example.com</option></select>
        </label>
        <label><span data-copy="access"></span>
          <select id="access"><option value="viewer" data-copy="viewer"></option><option value="member" data-copy="member"></option><option value="denied" data-copy="denied"></option></select>
        </label>
        <label><span data-copy="scenario"></span>
          <select id="scenario"><option value="normal" data-copy="normal"></option><option value="unavailable" data-copy="smtpOff"></option><option value="send-fails" data-copy="sendFails"></option><option value="load-error" data-copy="loadFailed"></option></select>
        </label>
      </div>
      <div class="preview-inbox" id="preview-inbox" hidden>
        <button id="copy-code" type="button" data-copy="useCode"></button>
        <button id="expire" type="button" class="ghost" data-copy="expireCode"></button>
        <code id="preview-code"></code>
      </div>
      <button id="skip-wait" type="button" class="ghost" data-copy="skipWait" hidden></button>
    </div>
  </details>

  <div class="app" id="app" data-screen-id="weekly-report-settings">
    <aside class="sidebar">
      <strong class="wordmark">Rivu</strong>
      <span class="side-item" data-copy="allSites"></span>
      <span class="side-item current" data-site></span>
      <span class="side-item" data-copy="account"></span>
    </aside>
    <header class="mobile-header"><strong>Rivu</strong><h1 data-site></h1></header>
    <main class="page">
      <header class="site-header">
        <div class="site-title"><span class="avatar" aria-hidden="true" id="avatar"></span><h1 data-site></h1></div>
        <div class="tabs" id="site-tabs">
          <span data-copy="dashboard"></span>
          <span data-copy="diagnostics" data-member hidden></span>
          <span data-copy="install"></span>
          <span aria-current="page" data-copy="settings"></span>
        </div>
      </header>
      <div class="layout">
        <nav class="sections" id="sections" aria-label="站点设置">
          <span data-copy="shield" data-member hidden></span>
          <span data-copy="goals" data-member hidden></span>
          <span data-copy="sharing" data-member hidden></span>
          <a href="#weekly-report" aria-current="page" data-copy="weekly"></a>
        </nav>

        <section class="card" id="report-card" aria-labelledby="weekly-report">
          <header class="card-header">
            <h2 id="weekly-report" tabindex="-1" data-copy="weekly"></h2>
            <span class="badge" id="badge" role="status"></span>
          </header>
          <div class="card-body empty" id="unready" hidden>
            <p id="loading" role="status" data-copy="loading" hidden></p>
            <p id="problem" role="alert"></p>
            <button id="retry" type="button" data-copy="retry" hidden></button>
          </div>
          <form id="report-form" novalidate>
            <div class="card-body">
              <dl>
                <div class="field"><dt data-copy="recipient"></dt><dd id="email">viewer@example.com</dd></div>
                <div class="field"><dt data-copy="schedule"></dt><dd id="schedule"></dd></div>
                <div class="field">
                  <dt data-copy="reportContent"></dt>
                  <dd><p data-copy="metrics"></p><p class="hint" id="example"></p></dd>
                </div>
              </dl>
              <div class="field" id="verification" hidden>
                <label for="code" data-copy="code"></label>
                <div>
                  <input id="code" type="text" autocomplete="one-time-code" spellcheck="false" autocapitalize="off" required aria-describedby="code-hint code-error">
                  <p class="hint" id="code-hint" data-copy="codeHint"></p>
                  <p class="error" id="code-error" role="alert"></p>
                </div>
              </div>
              <p class="callout" id="mail-warning" role="status" hidden></p>
            </div>
            <div class="card-footer">
              <p id="feedback" role="status"></p>
              <span id="cooldown" role="timer" aria-live="off" hidden></span>
              <div class="actions">
                <button id="cancel" type="button" class="ghost" hidden></button>
                <button id="resend" type="button" data-copy="resend" hidden></button>
                <button id="send" type="button" class="primary" data-copy="send"></button>
                <button id="activate" type="submit" class="primary" data-copy="activate" hidden></button>
              </div>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script>
    const copy = {
      preview: ["原型预览", "Prototype preview"], language: ["语言", "Language"], sites: ["站点", "Site"],
      access: ["身份", "Access"], viewer: ["站点查看者", "Site viewer"], member: ["组织成员（编辑者）", "Organization member (editor)"],
      denied: ["无站点权限", "No site access"], scenario: ["场景", "Scenario"], normal: ["正常", "Normal"],
      smtpOff: ["邮件服务不可用", "Mail unavailable"], sendFails: ["确认码邮件发送失败", "Confirmation email fails"],
      useCode: ["填入预览确认码", "Use preview code"], expireCode: ["让确认码过期", "Expire code"], skipWait: ["结束等待", "End wait"],
      allSites: ["全部站点", "All sites"], account: ["账号与安全", "Account & security"],
      dashboard: ["看板", "Dashboard"], diagnostics: ["接入诊断", "Ingest diagnostics"], install: ["安装", "Install"],
      settings: ["设置", "Settings"], settingsNav: ["站点设置", "Site settings"],
      shield: ["屏蔽规则", "Block rules"], goals: ["目标", "Goals"], sharing: ["共享", "Sharing"], weekly: ["我的周报", "My weekly report"],
      recipient: ["接收邮箱", "Recipient email"], schedule: ["发送时间", "Send schedule"], reportContent: ["周报内容", "Report contents"],
      metrics: ["上一完整周的访客、访问和浏览量", "Visitors, visits and pageviews for the previous complete week"],
      inactive: ["未订阅", "Not subscribed"], pending: ["待确认", "Confirmation pending"], active: ["已订阅", "Subscribed"],
      send: ["发送确认码", "Send confirmation code"], resend: ["重新发送", "Resend code"], activate: ["确认订阅", "Confirm subscription"],
      cancelPending: ["取消确认", "Cancel confirmation"], cancelActive: ["取消订阅", "Unsubscribe"],
      code: ["确认码", "Confirmation code"], codeHint: ["粘贴邮件中的最新确认码。", "Paste the latest confirmation code from your email."],
      codeEmpty: ["请输入确认码。", "Enter a confirmation code."],
      codeBad: ["确认码无效或已过期。检查最新一封邮件，或重新发送。", "That code is invalid or expired. Check the latest email or request a new code."],
      codeVoid: ["确认码已失效，请重新发送。", "The code is no longer valid. Request a new one."],
      sendFailed: ["确认码邮件没有发出，请稍后重新发送。", "The confirmation email couldn’t be sent. Try again shortly."],
      wait: ["{n} 秒后可再次发送", "Request another code in {n} s"],
      unavailableNew: ["邮件服务暂不可用，恢复后可发送确认码。", "Mail is temporarily unavailable. You can request a code when it returns."],
      unavailablePending: ["邮件服务暂不可用，恢复后可继续确认。", "Mail is temporarily unavailable. You can continue when it returns."],
      unavailableActive: ["邮件服务暂不可用，周报暂停发送。", "Mail is temporarily unavailable. Report sending is paused."],
      loading: ["正在加载周报设置…", "Loading weekly report settings…"],
      loadFailed: ["周报设置加载失败", "Couldn’t load weekly report settings"], retry: ["重试", "Retry"],
      siteNotFound: ["站点不存在或你没有访问权限。", "The site is unavailable or you don’t have access."],
      sending: ["正在请求发送确认码…", "Requesting a confirmation code…"], sent: ["已请求发送，请检查接收邮箱。", "Code requested. Check your inbox."],
      resent: ["已请求发送新确认码。此前的确认码已失效。", "A new code was requested. The previous code is no longer valid."],
      confirming: ["正在确认订阅…", "Confirming subscription…"], cancelling: ["正在取消…", "Cancelling…"],
      unsubscribed: ["已取消周报订阅。", "You’ve unsubscribed from this report."],
      abandoned: ["已取消确认。", "Confirmation cancelled."],
    };

    const sites = {
      studio: { name: "studio.example.com", timezone: "Asia/Taipei", sendDate: "2026-11-23", weekStart: "2026-11-16", weekEnd: "2026-11-22" },
      docs: { name: "docs.example.com", timezone: "Asia/Taipei", sendDate: "2026-11-22", weekStart: "2026-11-15", weekEnd: "2026-11-21" },
    };
    const MAX_ATTEMPTS = 5;
    const WAIT_MS = 60_000;
    const byId = (id) => document.getElementById(id);
    const language = byId("language");
    const site = byId("site");
    const access = byId("access");
    const scenario = byId("scenario");
    const form = byId("report-form");
    const heading = byId("weekly-report");
    const code = byId("code");
    const email = { viewer: "viewer@example.com", member: "member@example.com" };
    const subscriptions = new Map();
    const lastRequest = new Map();
    let readiness = "ready";
    let timer = null;
    let busy = "";
    let feedback = "";
    let tone = "";
    let codeError = "";

    const english = () => language.value === "en";
    const t = (key, n) => key ? copy[key][english() ? 1 : 0].replace("{n}", n) : "";
    const subscriptionKey = () => `${access.value}:${site.value}`;
    const subscription = () => subscriptions.get(subscriptionKey()) ?? { state: "inactive" };
    const mailAvailable = () => scenario.value !== "unavailable";
    const waitLeft = () => Math.max(0, Math.ceil(((lastRequest.get(access.value) ?? -Infinity) + WAIT_MS - Date.now()) / 1000));

    function setText(element, value) {
      if (element.textContent !== value) element.textContent = value;
    }

    function token() {
      const bytes = crypto.getRandomValues(new Uint8Array(32));
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function renderSchedule() {
      const current = sites[site.value];
      const options = { timeZone: current.timezone };
      const date = (value) => new Date(`${value}T09:00:00+08:00`);
      const weekday = new Intl.DateTimeFormat(language.value, { ...options, weekday: "long" }).format(date(current.sendDate));
      const day = new Intl.DateTimeFormat(language.value, { ...options, month: "short", day: "numeric" });
      setText(byId("schedule"), english() ? `${weekday} after 09:00 (${current.timezone})` : `每${weekday.replace("星期", "周")} 09:00 后（${current.timezone}）`);
      if (english()) {
        const range = day.formatRange(date(current.weekStart), date(current.weekEnd));
        setText(byId("example"), `For example, the ${day.format(date(current.sendDate))} report covers ${range}.`);
      } else {
        const ymd = (value) => day.format(date(value)).replace(/(\d+)月(\d+)日/, "$1 月 $2 日");
        setText(byId("example"), `例如，${ymd(current.sendDate)}这期覆盖 ${ymd(current.weekStart)}至 ${ymd(current.weekEnd)}。`);
      }
    }

    function render() {
      const denied = access.value === "denied";
      const ready = !denied && readiness === "ready";
      const { state, token: current, delivered, expiresAt } = subscription();
      const pending = state === "pending";
      const available = mailAvailable();
      const wait = waitLeft();
      document.documentElement.lang = language.value;
      document.title = `${t("weekly")} – Rivu`;
      document.querySelectorAll("[data-copy]").forEach((node) => setText(node, t(node.dataset.copy)));
      document.querySelectorAll("[data-site]").forEach((node) => {
        node.hidden = denied;
        setText(node, denied ? "" : sites[site.value].name);
      });
      document.querySelectorAll("[data-member]").forEach((node) => { node.hidden = access.value !== "member"; });
      byId("app").classList.toggle("denied", denied);
      byId("site-tabs").hidden = denied;
      byId("sections").hidden = denied;
      byId("sections").setAttribute("aria-label", t("settingsNav"));
      byId("avatar").hidden = denied;
      setText(byId("avatar"), sites[site.value].name[0].toUpperCase());
      setText(byId("email"), email[access.value] ?? "");
      renderSchedule();

      byId("badge").hidden = !ready;
      byId("badge").dataset.state = state;
      setText(byId("badge"), ready ? t(state) : "");
      byId("unready").hidden = ready;
      byId("loading").hidden = denied || readiness !== "loading";
      byId("retry").hidden = denied || readiness !== "error";
      setText(byId("problem"), denied ? t("siteNotFound") : readiness === "error" ? t("loadFailed") : "");
      form.hidden = !ready;
      byId("verification").hidden = !pending;
      code.readOnly = Boolean(busy) || !available;
      code.setAttribute("aria-invalid", Boolean(codeError));
      setText(byId("code-error"), t(codeError));
      byId("mail-warning").hidden = available;
      setText(byId("mail-warning"), available ? "" : t({ inactive: "unavailableNew", pending: "unavailablePending", active: "unavailableActive" }[state]));
      setText(byId("feedback"), t(feedback));
      byId("feedback").dataset.tone = tone;
      byId("feedback").setAttribute("role", tone === "bad" ? "alert" : "status");
      const cooling = ready && available && state !== "active" && wait > 0 && !busy;
      byId("cooldown").hidden = !cooling;
      setText(byId("cooldown"), cooling ? t("wait", wait) : "");
      byId("send").hidden = state !== "inactive";
      byId("resend").hidden = !pending;
      byId("activate").hidden = !pending;
      byId("cancel").hidden = state === "inactive";
      setText(byId("cancel"), t(pending ? "cancelPending" : "cancelActive"));
      for (const id of ["send", "resend", "activate", "cancel"]) {
        const button = byId(id);
        button.disabled = (id !== "cancel" && !available) || ((id === "send" || id === "resend") && wait > 0);
        button.setAttribute("aria-disabled", Boolean(busy) || button.disabled);
        button.setAttribute("aria-busy", busy === id);
      }
      const inbox = ready && pending && available && delivered;
      byId("preview-inbox").hidden = !inbox;
      setText(byId("preview-code"), inbox ? current : "");
      byId("copy-code").disabled = Boolean(busy);
      byId("expire").disabled = Boolean(busy) || Date.now() >= expiresAt;
      byId("skip-wait").hidden = !(ready && wait > 0);
    }

    setInterval(() => { if (lastRequest.size) render(); }, 1000);

    function run(action, progress, apply) {
      if (busy || readiness !== "ready" || access.value === "denied") return;
      busy = action;
      feedback = progress;
      tone = "";
      render();
      timer = setTimeout(() => {
        busy = "";
        const focus = apply();
        render();
        focus?.focus();
      }, 280);
    }

    function requestCode(resend) {
      if (!mailAvailable() || waitLeft() > 0) return;
      run(resend ? "resend" : "send", "sending", () => {
        const delivered = scenario.value !== "send-fails";
        lastRequest.set(access.value, Date.now());
        subscriptions.set(subscriptionKey(), { state: "pending", token: token(), delivered, attempts: 0, expiresAt: Date.now() + 15 * 60_000 });
        code.value = "";
        codeError = "";
        feedback = delivered ? (resend ? "resent" : "sent") : "sendFailed";
        tone = delivered ? "" : "bad";
        return delivered ? code : heading;
      });
    }

    function voidCode() {
      subscriptions.delete(subscriptionKey());
      code.value = "";
      codeError = "";
      feedback = "codeVoid";
      tone = "bad";
      render();
      heading.focus();
    }

    byId("send").onclick = () => requestCode(false);
    byId("resend").onclick = () => requestCode(true);
    form.onsubmit = (event) => {
      event.preventDefault();
      const current = subscription();
      if (current.state !== "pending" || !mailAvailable() || busy) return;
      const value = code.value.trim();
      feedback = "";
      tone = "";
      if (!value) {
        codeError = "codeEmpty";
        render();
        code.focus();
        return;
      }
      const valid = current.delivered && Date.now() < current.expiresAt && value === current.token;
      if (!valid) {
        current.attempts += 1;
        if (Date.now() >= current.expiresAt || current.attempts >= MAX_ATTEMPTS) return voidCode();
        codeError = "codeBad";
        render();
        code.focus();
        return;
      }
      run("activate", "confirming", () => {
        subscriptions.set(subscriptionKey(), { state: "active" });
        code.value = "";
        codeError = "";
        feedback = "";
        return byId("cancel");
      });
    };
    byId("cancel").onclick = () => run("cancel", "cancelling", () => {
      feedback = subscription().state === "pending" ? "abandoned" : "unsubscribed";
      subscriptions.delete(subscriptionKey());
      code.value = "";
      codeError = "";
      return mailAvailable() && waitLeft() === 0 ? byId("send") : heading;
    });
    byId("copy-code").onclick = () => {
      code.value = subscription().token;
      code.focus();
    };
    byId("expire").onclick = () => {
      subscription().expiresAt = 0;
      render();
      code.focus();
    };
    byId("skip-wait").onclick = () => {
      lastRequest.delete(access.value);
      render();
    };
    byId("retry").onclick = () => {
      readiness = "loading";
      render();
      heading.focus();
      timer = setTimeout(() => {
        scenario.value = "normal";
        readiness = "ready";
        render();
      }, 350);
    };
    function resetView() {
      clearTimeout(timer);
      busy = feedback = tone = codeError = code.value = "";
      readiness = scenario.value === "load-error" ? "error" : "ready";
      render();
    }
    language.onchange = render;
    site.onchange = access.onchange = scenario.onchange = resetView;
    render();
  </script>
</body>
</html>
