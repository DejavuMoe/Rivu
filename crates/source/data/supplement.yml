# Rivu 自维护的来源补充表（随 RULES_VERSION 管理：任何改动都要加一，见 src/lib.rs）。
#
# 作用（优先级从高到低，先登记的域名/别名先赢，见 build.rs）：
#   1. 补充表里的条目覆盖 Matomo 数据里同一域名的名字和类别；
#   2. Matomo 的三份列表（data/matomo/）：AIAssistants > Socials > SearchEngines；
#   3. renames：把 Matomo 的名字改成 Rivu 的展示名，或把同一家的子产品合并成一个名字。
#
# 条目字段：
#   name          展示名，写入 referrer_source；同名同类别的条目在表里只有一个。
#   kind          search | social | video | shopping | ai | email | other。other 只命名，不参与渠道类别。
#   domains       域名后缀：`youtube.com` 同时命中 `m.youtube.com`；结尾 `.{}` 是国家/地区后缀占位符
#                 （语义见 docs/research/enrich-source.md §4.3；YAML 里含 `{}` 的值必须加引号：`["amazon.{}"]`）。
#   aliases       utm_source 里常见的写法，小写；名字本身自动成为别名，不用重复写。
#   paid_aliases  utm_source 本身就表示「付费」的写法（如 `fb-ads`）：来源按本条目解析，
#                 且视为付费证据，与 utm_medium 的付费正则等价。
#   basis         依据。没有 basis 的条目不允许存在。
#
# 依据缩写：
#   GA4-LIST   Google 官方「来源与类别」清单（见 docs/research/enrich-source.md §2.2，下载于 2026-10-22）把该来源列为对应类别。
#   FACT       公开可验证的事实：该域名由该产品官方持有、官方文档或站点本身可查。
#   CONVENTION 业界常见的 utm_source 写法；行为参照 Plausible（只借鉴行为，不复制其数据文件）。

renames:
  # Matomo 名字的拼写/大小写修正
  "Twitter": "X (Twitter)"      # 2023-07 更名为 X，用户仍按 Twitter 搜索，两个名字并列
  "reddit": "Reddit"
  "tumblr": "Tumblr"
  "Google%2B": "Google+"         # Matomo 里的名字是百分号编码形态
  "Haboo": "Habbo"               # Matomo 的拼写错误（域名是 habbo.com）
  "Deepseek": "DeepSeek"
  "Copilot": "Microsoft Copilot" # copilot.microsoft.com；避免与 GitHub Copilot 混淆
  "Gemini": "Google Gemini"
  # 同一家的子产品合并成一个来源：用户关心「来自 Google」，不关心是图片搜索还是地图
  "Google Images": "Google"
  "Google Maps": "Google"
  "Google News": "Google"
  "Google Scholar": "Google"
  "Google Blogsearch": "Google"
  "Google Custom Search": "Google"
  "Google syndicated search": "Google"
  "Google Translations": "Google"
  "Google Video": "Google"
  "Bing Images": "Bing"
  "Yahoo! Images": "Yahoo!"
  "Yahoo! Directory": "Yahoo!"
  "Yahoo! Japan Images": "Yahoo! Japan"
  "Yahoo! Japan Videos": "Yahoo! Japan"
  "Yandex Images": "Yandex"
  "Biglobe Images": "Biglobe"
  "auone Images": "auone"

